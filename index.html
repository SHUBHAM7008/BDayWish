<!DOCTYPE html>
<html>
<head>
  <title>Chat 😄</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #0f2027, #203a43, #2c5364);
      color: white;
    }

    /* 🔥 Bigger responsive chat */
    .chat-box {
      width: 90vw;
      max-width: 420px;
      height: 85vh;
      max-height: 700px;

      background: rgba(0,0,0,0.6);
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0,255,255,0.2);

      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 18px;
      text-align: center;
      font-weight: bold;
      font-size: 16px;
      background: rgba(255,255,255,0.05);
    }

    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .bubble {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 15px;
      animation: pop 0.3s ease;
    }

    .left {
      background: rgba(255,255,255,0.1);
      align-self: flex-start;
    }

    .right {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: black;
      align-self: flex-end;
    }

    /* 🎉 Birthday special */
    .birthday {
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: black;
      font-weight: bold;
      text-align: center;
      align-self: center;
      animation: popBig 0.6s ease, glow 1.5s infinite alternate;
      box-shadow: 0 0 15px rgba(255,255,255,0.6);
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @keyframes popBig {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    @keyframes glow {
      from { box-shadow: 0 0 10px rgba(255,255,255,0.5); }
      to { box-shadow: 0 0 25px rgba(255,255,255,1); }
    }

    .typing {
      font-size: 12px;
      opacity: 0.7;
      margin: 5px;
    }

    .footer {
      padding: 18px;
      text-align: center;
      background: rgba(255,255,255,0.05);
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
    }
  </style>
</head>

<body>

<div class="chat-box">
  <div class="header">Chat 😄</div>

  <div class="messages" id="chat"></div>

  <div class="footer">
    <button onclick="start()" id="btn">Start</button>
  </div>
</div>

<script>
const convo = [
  { text: "ए ऐक… आधी शांत बस 😄", side: "left" },
  { text: "काय झालं आता? 😏", side: "right" },

  { text: "आज तू खूप busy असणार… obviously birthday आहे ना 😏", side: "left" },
  { text: "हो तर 😎", side: "right" },

  { text: "आणि हो… सगळ्यांसोबत जास्त enjoy करू नकोस 😑", side: "left" },
  { text: "का? 😄", side: "right" },

  { text: "थोडं attention इथे पण ठेव 😄", side: "left" },
  { text: "बघते 😏", side: "right" },

  { text: "तू कधी कधी खूपच random असतेस 😂", side: "left" },
  { text: "तुलाच समजत नाही 😎", side: "right" },

  { text: "पण honestly… तेच मजेशीर आहे", side: "left" },
  { text: "Obviously 😄", side: "right" },

  { text: "कधी nonsense बोलतेस, कधी smart वाटतेस 😏", side: "left" },
  { text: "multi-talented आहे 😌", side: "right" },

  { text: "combo भारी आहे तुझा 😄", side: "left" },
  { text: "माहितीय मला 😏", side: "right" },

  { text: "आपण कधी argue करतो, कधी हसतो…", side: "left" },
  { text: "हो ते खरं आहे 😄", side: "right" },

  { text: "पण vibe always same राहते somehow", side: "left" },
  { text: "because I’m awesome 😎", side: "right" },

  { text: "बाकी काही नाही… just बोलायचं होतं 😄", side: "left" },
  { text: "hmm okay 😄", side: "right" },

  { text: "आजचा दिवस full enjoy कर", side: "left" },
  { text: "करते 😏", side: "right" },

  { text: "🎉 Happy Birthday 🎂", side: "left" }
];

let i = 0;

function start() {
  document.getElementById("btn").style.display = "none";
  showNext();
}

function showNext() {
  if (i < convo.length) {

    showTyping();

    setTimeout(() => {
      addMessage(convo[i].text, convo[i].side);
      i++;
      setTimeout(showNext, 1700);
    }, 700);

  }
}

function showTyping() {
  const chat = document.getElementById("chat");

  const typing = document.createElement("div");
  typing.className = "typing";
  typing.innerText = "typing...";
  chat.appendChild(typing);

  chat.scrollTop = chat.scrollHeight;

  setTimeout(() => {
    typing.remove();
  }, 600);
}

function addMessage(text, side) {
  const chat = document.getElementById("chat");

  const div = document.createElement("div");

  if (text.includes("Happy Birthday")) {
    div.className = "bubble birthday";
  } else {
    div.className = "bubble " + side;
  }

  div.innerText = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
